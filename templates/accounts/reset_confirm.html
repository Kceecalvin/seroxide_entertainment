{% extends "base.html" %}{% block title %}Password recovery{% endblock %}{% block content %}<section class="shell market-shell"><div class="market-panel market-reset"><p class="eyebrow gold">YOUR ACCOUNT</p><h1>A fresh start.</h1>{% if validlink %}<form method="post" class="market-form">{% csrf_token %}{{ form.as_p }}<button class="button button-primary">Save new password</button></form>{% else %}<p>This link has expired or was already used.</p><a href="{% url 'accounts:password_reset' %}">Request a new link</a>{% endif %}<p><a href="{% url 'accounts:login' %}">Back to login →</a></p></div></section>{% endblock %}
