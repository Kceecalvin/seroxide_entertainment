{% extends "base.html" %}
{% block title %}Password Changed{% endblock %}
{% block body_class %}accounts-page app-utility{% endblock %}
{% block content %}
<section class="mx-auto flex min-h-[50vh] max-w-md flex-col items-center justify-center px-4 py-16 text-center sm:px-6 lg:px-8">
  <p class="text-xs font-bold uppercase tracking-widest text-accent">Account</p>
  <h1 class="font-poster mt-1 text-4xl">Password updated</h1>
  <p class="mt-3 text-sm text-zinc-400">Your password has been changed successfully.</p>
  <a href="{% url 'accounts:settings' %}" class="btn-press btn-primary mt-6 inline-block rounded-full px-6 py-2.5 text-sm font-bold uppercase tracking-wide text-white transition">
    Back to settings
  </a>
</section>
{% endblock %}
