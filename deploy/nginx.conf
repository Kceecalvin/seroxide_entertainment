# /etc/nginx/sites-available/serotix.co.ke — symlink into sites-enabled.
# serotix.co.ke is the primary domain; serotix.space redirects here (see
# deploy/nginx-serotix-space.conf). SSL managed by certbot — don't hand-edit
# the ssl_certificate lines below, `certbot renew` regenerates them.
#
# form-action includes checkout.paystack.com (and checkout.stripe.com, kept
# for old Payment rows / any lingering test flows): without it, Chrome
# silently refuses to follow the redirect after a same-origin form POST — the
# payment succeeds server-side (order+transaction created, 302 issued) but
# the browser never navigates, leaving the buyer stuck on a "Processing…"
# button forever. Found via a real stuck checkout, not a theoretical
# hardening gap.

server {
    server_name serotix.co.ke www.serotix.co.ke;

    client_max_body_size 10M;  # event cover images / lineup photos

    # CSP note: 'unsafe-eval' is required by Alpine.js (this project uses the
    # standard build, not the @alpinejs/csp variant) — it evaluates x-data /
    # @click expressions via `new Function()`. 'unsafe-inline' on style-src
    # is required for the hero slideshow's inline background-image styles.
    # All page-specific JS must live in external static files (never inline
    # <script> tags) — script-src has no 'unsafe-inline', so an inline
    # script is silently dropped by the browser with no visible error.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com https://checkout.stripe.com; frame-ancestors 'self'" always;

    location /static/ {
        alias /srv/serotix/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/serotix/app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/serotix/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/serotix.co.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/serotix.co.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.serotix.co.ke) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = serotix.co.ke) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name serotix.co.ke www.serotix.co.ke;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
